<div class="layout h-full">
  <app-splitter class="h-full">
    <!--  EXPLORER CONTIANER  -->
    <ng-container>
      <rusty-folder-tree #explorer></rusty-folder-tree>
      @if (!explorer.fileDirectories) {
        <rusty-landing-page>
          <p-button
            (onClick)="openWorkspace()"
            [style]="{ fontSize: '0.8rem', width: '130px', padding: '0.7rem' }"
            label="Open Directory"
            [text]="true"
            [raised]="true"
          />
        </rusty-landing-page>
      }
    </ng-container>

    <!--  WORKPAD Container  -->
    <ng-container panel2 class="w-full">
      <app-tabs class="w-full" #rustyTabs></app-tabs>
      @if (rustyTabs.activeTab() != null) {
        <app-workpad></app-workpad>
      }
      @if (!rustyTabs.activeTab()) {
        <rusty-landing-page [showIcon]="true" [commands]="appCommands"></rusty-landing-page>
      }
    </ng-container>
  </app-splitter>
</div>
