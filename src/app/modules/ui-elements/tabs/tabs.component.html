@if (activeIndex() != null && activeIndex()! >= 0) {
  <p-tabView
    (onClose)="tabClose($event)"
    [scrollable]="true"
    (activeIndexChange)="handleTabIndexChange($event)"
    [activeIndex]="activeIndex()!"
  >
    @for (tab of (tabState().tabs | keyvalue : idBasedOrder); track tab.value.id) {
      <p-tabPanel [closable]="tab.value.isClosable">
        <!-- HEADER -->
        <ng-template pTemplate="header">
          <div class="flex align-items-center gap-2">
            {{ tab.value.title }}@if (tab.value.isDirty) {<span aria-label="unsaved changes">&nbsp;•</span>}
          </div>
        </ng-template>
      </p-tabPanel>
    }
  </p-tabView>
}
